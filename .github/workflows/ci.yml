name: InmoFinder checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://fixture.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: fixture-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock --config supabase/functions/deno.json supabase/functions/*/index.ts
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix workers/browser --ignore-scripts
      - run: npm test --prefix workers/browser
      - run: npm run test:browser
      - name: Independent frontend container and SPA routes
        run: |
          docker build --build-arg VITE_SUPABASE_URL --build-arg VITE_SUPABASE_PUBLISHABLE_KEY -t inmofinder-frontend .
          docker run -d --name inmofinder-frontend -p 127.0.0.1:8090:8080 inmofinder-frontend
          cleanup() {
            docker logs inmofinder-frontend
            docker rm -f inmofinder-frontend
          }
          trap cleanup EXIT
          curl --retry 10 --retry-all-errors --retry-max-time 20 --retry-delay 1 --max-time 5 --fail http://127.0.0.1:8090/cliente/dashboard -o /tmp/inmofinder-page.html
          grep -q 'id="root"' /tmp/inmofinder-page.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/assets/missing.js)" = 404
      - name: Worker production image
        run: docker build --target worker -f workers/browser/Dockerfile -t inmofinder-worker .

      - name: Complete Compose, private CDP, restart and durable queue
        env:
          SCRAPER_API_KEY: isolated-ci-worker-key-not-a-production-secret
        run: |
          cp workers/browser/sources.example.json workers/browser/sources.local.json
          cleanup() {
            docker compose logs --tail=80
            docker compose down --volumes
          }
          trap cleanup EXIT
          docker compose up --build --wait --wait-timeout 120 -d
          docker compose exec -T worker node src/compose-smoke.mjs
          docker compose exec -T worker node src/backup.mjs --to data/ci-backup.sqlite
          docker compose restart worker
          docker compose up --wait --wait-timeout 60 -d
          docker compose exec -T worker node src/compose-smoke.mjs --verify
          docker compose exec -T worker node src/backup.mjs --verify data/ci-backup.sqlite
          test -z "$(docker compose port browser 9222)"
